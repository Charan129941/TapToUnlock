[package]
name = "opentap-core"
version = "0.1.0"
edition = "2021"
authors = ["OpenTapUnlock Engineering Team <security@opentapunlock.org>"]
description = "Zero-trust cryptographic, pairing, and transport core for OpenTapUnlock"
license = "Apache-2.0 OR MIT"

[lib]
name = "opentap_core"
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
# Cryptographic primitives (ed25519 digital signatures & x25519 ECDH key exchange)
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde"] }
x25519-dalek = { version = "2.0", features = ["static_secrets", "serde"] }
aes-gcm = "0.10"
rand = "0.8"
rand_core = "0.6"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"

# Async Runtime and Networking
tokio = { version = "1.38", features = ["full", "rt", "net", "sync", "time"] }
async-trait = "0.1"
uuid = { version = "1.8", features = ["v4"] }

# Bluetooth Low Energy (BLE GATT client & server abstractions)
btleplug = "0.11"

# mDNS / ZeroConf Local Network Discovery
mdns-sd = "0.11"

# Mutual TLS (mTLS 1.3) & Certificate Generation
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = "0.26"
rustls-pki-types = "1.7"
rcgen = "0.13"

# Serialization and Time
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
postcard = { version = "1.0", features = ["alloc", "use-std"] }
chrono = { version = "0.4", features = ["serde", "clock"] }

# Error handling
thiserror = "1.0"

[dev-dependencies]
proptest = "1.4"
