[package]
name = "opentap-jni"
version = "0.1.0"
edition = "2021"
authors = ["OpenTapUnlock Engineering Team <security@opentapunlock.org>"]
description = "Rust JNI bridge (libopentap_jni.so) connecting Android Kotlin app with opentap-core"
license = "Apache-2.0 OR MIT"

[lib]
name = "opentap_jni"
crate-type = ["cdylib"]

[dependencies]
opentap-core = { path = "../../../core" }
jni = "0.21"
serde_json = "1.0"
thiserror = "1.0"
hex = "0.4"
chrono = "0.4"
