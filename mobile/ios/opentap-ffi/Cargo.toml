[package]
name = "opentap-ffi"
version = "0.1.0"
edition = "2021"
authors = ["OpenTapUnlock Engineering Team <security@opentapunlock.org>"]
description = "Rust iOS C-ABI static library (libopentap_ffi.a) for Swift/SwiftUI and Secure Enclave integration"
license = "Apache-2.0 OR MIT"

[lib]
name = "opentap_ffi"
crate-type = ["staticlib", "cdylib"]

[dependencies]
opentap-core = { path = "../../../core" }
libc = "0.2"
serde_json = "1.0"
thiserror = "1.0"
hex = "0.4"
chrono = "0.4"
