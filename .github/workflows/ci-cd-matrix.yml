name: OpenTap 100-Case E2E Verification & CI/CD Pipeline

on:
  push:
    branches: [ "main", "release/*" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test_matrix_and_build:
    name: Test Matrix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Install Stable Rust Toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Cargo Dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}

    - name: Install Linux Build Dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

    - name: Build OpenTap Core & Daemon
      run: cargo build --release --workspace --exclude e2e-matrix

    - name: Execute 100-Case E2E Integration Matrix
      run: cargo run --release --package e2e-matrix

    - name: Run Workspace Unit Tests
      run: cargo test --workspace --exclude e2e-matrix

  bundle_release:
    name: Create Production Release Bundles
    needs: test_matrix_and_build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4
    - name: Echo Release Summary
      run: echo "All 100 E2E integration test cases verified across Linux, Windows, and macOS! Ready for production deployment."
