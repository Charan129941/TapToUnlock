[package]
name = "windows-cred-provider"
version = "0.1.0"
edition = "2021"
authors = ["OpenTapUnlock Engineering Team <security@opentapunlock.org>"]
description = "Zero-trust Windows Custom Credential Provider (COM DLL) for Winlogon lock screen & UAC unlocking"
license = "Apache-2.0 OR MIT"

[lib]
name = "OpenTapCredProvider"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Official Microsoft Windows COM and Win32 APIs
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Memory",
    "Win32_UI_Shell",
    "Win32_Security_Authentication_Identity",
    "Win32_System_Registry",
] }
windows-core = "0.58"

# Serialization and IPC
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
uuid = { version = "1.8", features = ["v4", "serde"] }

# Logging
log = "0.4"

[dev-dependencies]
tempfile = "3.10"
