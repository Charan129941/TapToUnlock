[package]
name = "opentapd"
version = "0.1.0"
edition = "2021"
authors = ["OpenTapUnlock Engineering Team <security@opentapunlock.org>"]
description = "Central zero-trust desktop system daemon for OpenTapUnlock (BLE/TLS listener + OS IPC server)"
license = "Apache-2.0 OR MIT"

[[bin]]
name = "opentapd"
path = "src/main.rs"

[dependencies]
opentap-core = { path = "../../core" }

# Async runtime and networking
tokio = { version = "1.38", features = ["full"] }

# CLI arguments and terminal formatting
clap = { version = "4.5", features = ["derive"] }
qr2term = "0.3"

# Serialization and configuration storage
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "5.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4"] }

# Error handling and logging
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
tempfile = "3.10"
